<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화재감지 순찰로봇 대시보드</title>
<meta name="theme-color" content="#c62828">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="순찰로봇">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!--
  화재감지 순찰로봇 웹 대시보드 (예제)
  - 파일 하나로 동작합니다. 폰/PC 브라우저에서 열면 됩니다.
  - 아래 <script> 맨 위의 BROKER_URL, TOPIC_PREFIX 를 ESP32 코드와 똑같이 맞추세요.
  - 공개 테스트 브로커(HiveMQ)는 누구나 접속할 수 있습니다. TOPIC_PREFIX 를 반드시
    추측하기 어려운 문자열로 바꾸고, 실제 운영 전에는 인증(ID/비밀번호)과 TLS 를 적용하세요.
-->
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d1f23; --sub: #6b7280; --border: #dfe2e6;
    --ok: #1a7f4b; --ok-bg: #e8f5ee; --warn: #b45309; --warn-bg: #fdf3e3;
    --danger: #c62828; --danger-bg: #fdecec; --accent: #2563eb; --btn: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --card: #1f2227; --text: #eceef1; --sub: #9aa1ab; --border: #31353c;
      --ok: #5fd39a; --ok-bg: #16301f; --warn: #f0b45a; --warn-bg: #36290f;
      --danger: #ff8a8a; --danger-bg: #3a1c1c; --accent: #7aa2ff; --btn: #2a2e35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 560px; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--sub); }
  .badge.on { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 10px; color: var(--sub); font-weight: 500; }
  .card.safe { border-color: var(--ok); background: var(--ok-bg); }
  .card.warn { border-color: var(--warn); background: var(--warn-bg); }
  .card.danger { border-color: var(--danger); background: var(--danger-bg); animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .65; } }
  @media (prefers-reduced-motion: reduce) { .card.danger { animation: none; } }
  .state { font-size: 28px; font-weight: 600; margin: 2px 0 12px; }
  .safe .state { color: var(--ok); } .warn .state { color: var(--warn); } .danger .state { color: var(--danger); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .grid3 div { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; }
  .k { display: block; font-size: 12px; color: var(--sub); }
  .v { font-size: 15px; font-weight: 500; }
  .meta { font-size: 12px; color: var(--sub); line-height: 1.7; }
  .meta b { color: var(--text); font-weight: 500; }
  .stale { color: var(--danger) !important; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--btn); color: var(--text); border-radius: 10px; }
  button:active { transform: scale(.97); }
  .ghost { margin-top: 10px; font-size: 12px; padding: 6px 12px; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 320px; margin: 0 auto 10px; }
  .pad button { height: 64px; font-size: 22px; }
  .pad .stop { color: var(--danger); font-weight: 600; font-size: 16px; }
  .pad button.active, .auto.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .auto { display: block; width: 100%; max-width: 320px; margin: 0 auto; height: 48px; font-size: 15px; }
  .cam-box { background: #000; border-radius: 8px; overflow: hidden; min-height: 120px; display: flex; align-items: center; justify-content: center; }
  .cam-box img { width: 100%; display: block; }
  .cam-box img[hidden], .cam-msg[hidden] { display: none; }
  .cam-msg { color: #9aa1ab; font-size: 13px; padding: 24px; text-align: center; }
  .cam-row { display: flex; gap: 6px; margin-top: 8px; }
  .cam-row input { flex: 1; min-width: 0; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; font-size: 13px; }
  .cam-row button { padding: 0 14px; }
  #log { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--sub); max-height: 140px; overflow-y: auto; line-height: 1.6; }
  .install { display:none; width:100%; margin-bottom:12px; padding:12px; background:var(--accent); color:#fff; border-color:var(--accent); font-size:15px; }
</style>
</head>
<body>

<header>
  <h1>화재감지 순찰로봇</h1>
  <div class="badges">
    <span id="badgeMqtt" class="badge">서버 연결 중</span>
    <span id="badgeRobot" class="badge">로봇 오프라인</span>
  </div>
</header>

<button id="btnInstall" class="install">홈 화면에 앱으로 설치</button>

<section id="fireCard" class="card">
  <h2>화재 상태</h2>
  <div id="stateText" class="state">--</div>
  <div class="grid3">
    <div><span class="k">온도</span><span id="vTemp" class="v">--</span></div>
    <div><span class="k">가스</span><span id="vGas" class="v">--</span></div>
    <div><span class="k">불꽃</span><span id="vFlame" class="v">--</span></div>
  </div>
  <div class="meta">
    주행 모드: <b id="vMode">--</b> · Wi-Fi 신호: <b id="vRssi">--</b><br>
    마지막 수신: <b id="vAge">--</b>
  </div>
  <button id="btnNotify" class="ghost">브라우저 알림 허용</button>
</section>

<section class="card">
  <h2>카메라</h2>
  <div class="cam-box">
    <img id="camImg" alt="로봇 카메라 영상" hidden>
    <div id="camMsg" class="cam-msg">카메라 주소를 입력하세요</div>
  </div>
  <div class="cam-row">
    <input id="camUrl" type="url" placeholder="예: http://172.25.62.100:81/stream">
    <button id="camApply">적용</button>
  </div>
</section>

<section class="card">
  <h2>조종</h2>
  <div class="pad">
    <span></span><button data-cmd="forward" aria-label="직진">▲</button><span></span>
    <button data-cmd="left" aria-label="좌회전">◀</button>
    <button data-cmd="stop" class="stop" aria-label="정지">정지</button>
    <button data-cmd="right" aria-label="우회전">▶</button>
    <span></span><button data-cmd="back" aria-label="후진">▼</button><span></span>
  </div>
  <button data-cmd="auto" class="auto">자율주행 시작</button>
</section>

<section class="card">
  <h2>로그</h2>
  <div id="log"></div>
</section>

<script src="mqtt.min.js"></script>
<script>
"use strict";

// ===== 설정: ESP32 코드의 값과 반드시 같게 맞추세요 =====
const BROKER_URL   = "wss://broker.hivemq.com:8884/mqtt";      // 브라우저는 WebSocket(wss) 포트를 씁니다
const TOPIC_PREFIX = "anyohan-fire-robot-CHANGE-ME/robot1";     // 남이 못 맞히는 문자열로 바꾸세요

const T_CMD    = TOPIC_PREFIX + "/command";   // 대시보드 -> 로봇 (명령)
const T_STATUS = TOPIC_PREFIX + "/status";    // 로봇 -> 대시보드 (센서/상태, JSON)
const T_ONLINE = TOPIC_PREFIX + "/online";    // 로봇 접속 여부 ("online"/"offline")

// ===== 화면 표시용 사전 =====
const STATE_LABEL = { SAFE: "안전", GAS: "가스 감지", HIGH_TEMP: "고온 감지", FLAME: "불꽃 감지", FIRE_DETECTED: "화재 감지!" };
const STATE_LEVEL = { SAFE: "safe", GAS: "warn", HIGH_TEMP: "warn", FLAME: "warn", FIRE_DETECTED: "danger" };
const MODE_LABEL  = { stop: "정지", forward: "직진", back: "후진", left: "좌회전", right: "우회전", auto: "자율주행" };

const $ = (id) => document.getElementById(id);
let lastStatusAt = 0;
let prevState = "";

function log(msg) {
  const el = $("log");
  const t = new Date().toLocaleTimeString("ko-KR", { hour12: false });
  el.insertAdjacentHTML("afterbegin", "<div></div>");
  el.firstChild.textContent = t + "  " + msg;
  while (el.childNodes.length > 30) el.removeChild(el.lastChild);
}

// ===== MQTT 연결 =====
const client = mqtt.connect(BROKER_URL, {
  clientId: "dash-" + Math.random().toString(16).slice(2, 10),
  reconnectPeriod: 3000,   // 끊기면 3초마다 자동 재접속
  keepalive: 30,
});

function setMqttBadge(on, text) {
  const b = $("badgeMqtt");
  b.textContent = text;
  b.classList.toggle("on", on);
}
function setRobotBadge(on) {
  const b = $("badgeRobot");
  b.textContent = on ? "로봇 온라인" : "로봇 오프라인";
  b.classList.toggle("on", on);
}

client.on("connect", () => {
  setMqttBadge(true, "서버 연결됨");
  log("브로커 연결됨");
  client.subscribe([T_STATUS, T_ONLINE], { qos: 0 }, (err) => { if (err) log("구독 실패: " + err.message); });
});
client.on("reconnect", () => { setMqttBadge(false, "재접속 중"); });
client.on("offline",   () => { setMqttBadge(false, "서버 끊김"); });
client.on("error",     (e) => { log("오류: " + e.message); });

client.on("message", (topic, payload) => {
  const text = payload.toString();
  if (topic === T_ONLINE) {
    setRobotBadge(text === "online");
    log("로봇 " + text);
  } else if (topic === T_STATUS) {
    try { renderStatus(JSON.parse(text)); }
    catch (e) { log("상태 메시지 해석 실패"); }
  }
});

// ===== 상태 표시 =====
function renderStatus(s) {
  const level = STATE_LEVEL[s.state] || "";
  $("fireCard").className = "card " + level;
  $("stateText").textContent = STATE_LABEL[s.state] || String(s.state);
  $("vTemp").textContent  = (s.temp === null || s.temp === undefined) ? "측정 불가" : Number(s.temp).toFixed(1) + " °C";
  $("vGas").textContent   = s.gas;
  $("vFlame").textContent = s.flame ? "감지됨" : "없음";
  $("vMode").textContent  = MODE_LABEL[s.mode] || s.mode;
  $("vRssi").textContent  = s.rssi + " dBm";
  lastStatusAt = Date.now();

  document.querySelectorAll("[data-cmd]").forEach((b) => b.classList.toggle("active", b.dataset.cmd === s.mode));

  if (s.state === "FIRE_DETECTED" && prevState !== "FIRE_DETECTED") { log("화재 감지!"); notifyFire(); }
  prevState = s.state;
}

setInterval(() => {
  const el = $("vAge");
  if (!lastStatusAt) { el.textContent = "--"; return; }
  const sec = Math.round((Date.now() - lastStatusAt) / 1000);
  el.textContent = sec + "초 전";
  el.classList.toggle("stale", sec > 5);   // 5초 넘게 안 오면 빨간색으로 표시
}, 1000);

// ===== 명령 보내기 =====
function sendCommand(cmd) {
  if (!client.connected) { log("서버에 연결되지 않아 명령을 보낼 수 없습니다"); return; }
  client.publish(T_CMD, cmd, { qos: 0 });
  log("명령 전송: " + (MODE_LABEL[cmd] || cmd));
}
document.querySelectorAll("[data-cmd]").forEach((b) => {
  b.addEventListener("click", () => sendCommand(b.dataset.cmd));
});

// ===== 브라우저 알림 (페이지가 열려 있을 때만 동작. 앱이 꺼져 있을 때의 푸시는 FCM 이 필요) =====
$("btnNotify").addEventListener("click", () => {
  if (!("Notification" in window)) { log("이 브라우저는 알림을 지원하지 않습니다"); return; }
  Notification.requestPermission().then((p) => log("알림 권한: " + p));
});
function notifyFire() {
  try {
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("화재 감지!", { body: "순찰로봇이 화재를 감지했습니다." });
    }
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
  } catch (e) { /* 알림 실패는 무시 */ }
}

// ===== 카메라 =====
let camTimer = null;
const camImg = $("camImg"), camMsg = $("camMsg"), camUrl = $("camUrl");

function applyCamera() {
  const url = camUrl.value.trim();
  try { localStorage.setItem("camUrl", url); } catch (e) { /* 저장 실패는 무시 */ }
  clearInterval(camTimer);
  if (!url) { camImg.hidden = true; camMsg.hidden = false; camMsg.textContent = "카메라 주소를 입력하세요"; return; }

  if (/stream/i.test(url)) {
    camImg.src = url;                       // MJPEG 스트림은 한 번만 연결
  } else {
    const load = () => { camImg.src = url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(); };
    load();                                 // 스냅샷 주소는 2초마다 새로 불러오기
    camTimer = setInterval(load, 2000);
  }
}
camImg.addEventListener("load",  () => { camImg.hidden = false; camMsg.hidden = true; });
camImg.addEventListener("error", () => {
  camImg.hidden = true; camMsg.hidden = false;
  camMsg.textContent = "영상을 불러오지 못했습니다 (주소, 같은 네트워크 여부, https 혼합 콘텐츠 확인)";
});
$("camApply").addEventListener("click", applyCamera);
try { camUrl.value = localStorage.getItem("camUrl") || ""; } catch (e) { /* 무시 */ }
if (camUrl.value) applyCamera();

// ===== PWA: 설치 버튼 + 서비스 워커 =====
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstall = e;
  $("btnInstall").style.display = "block";
});
$("btnInstall").addEventListener("click", async () => {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall = null;
  $("btnInstall").style.display = "none";
});
window.addEventListener("appinstalled", () => { $("btnInstall").style.display = "none"; log("앱이 설치되었습니다"); });
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").catch((e) => log("서비스 워커 등록 실패: " + e.message));
}
</script>
</body>
</html>
